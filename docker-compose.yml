version: "3.9"

services:
  server:
    build: ./Server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/syncdev
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=http://localhost:5173
      - PUBLIC_SERVER_URL=http://localhost:3000
      - EXEC_SERVICE_URL=http://exec-service:4000
      - EXEC_SERVICE_SECRET=${EXEC_SERVICE_SECRET:-change-me-in-production}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      exec-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  exec-service:
    build:
      context: ./ExecService
      dockerfile: Dockerfile.service
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "20000-20999:20000-20999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - EXEC_SERVICE_SECRET=${EXEC_SERVICE_SECRET:-change-me-in-production}
      - REDIS_URL=redis://redis:6379
      - CONTAINER_MEMORY_MB=512
      - CONTAINER_CPU_QUOTA=100000
      - CONTAINER_TIMEOUT_MS=0
      - CONTAINER_IDLE_TTL_MS=1800000
    privileged: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./Client
      args:
        - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - server
