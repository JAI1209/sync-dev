name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Client/package-lock.json
            Server/package-lock.json
      
      - name: Install Client Dependencies
        working-directory: ./Client
        run: npm ci
      
      - name: Install Server Dependencies
        working-directory: ./Server
        run: npm ci
      
      - name: Lint Client
        working-directory: ./Client
        run: npm run lint
      
      - name: Lint Server (ESLint check)
        working-directory: ./Server
        run: |
          if [ -f .eslintrc.js ] || [ -f eslint.config.js ]; then
            npx eslint . --max-warnings=0
          else
            echo "No ESLint config found, skipping server lint"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Client/package-lock.json
            Server/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd Client && npm ci
          cd ../Server && npm ci
      
      - name: Build Client
        working-directory: ./Client
        run: npm run build
      
      - name: Run Vitest suite
        working-directory: ./Server
        env:
          MONGODB_URI: mongodb://localhost:27017/syncdev_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_ci_only
          PORT: 3001
        run: npm test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json
      
      - name: Build Production Client
        working-directory: ./Client
        run: |
          npm ci
          npm run build
      
      - name: Verify Build Output
        run: |
          if [ ! -d "Client/dist" ]; then
            echo "Build output missing!"
            exit 1
          fi
          echo "✓ Build output verified"

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel Preview
        uses: vercel/action-deploy@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./Client

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint, test, build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Client to Vercel
        uses: vercel/action-deploy@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./Client
          vercel-args: '--prod'
      
      - name: Deploy Server to Railway
        uses: railway/action-deploy@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          project-id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service-id: ${{ secrets.RAILWAY_SERVICE_ID }}
